{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTM | Login</title>
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #0f172a;
        color: white;
      }
      .box {
        max-width: 420px;
        margin: 80px auto;
        background: #111827;
        padding: 32px;
        border-radius: 16px;
      }
      h1 {
        margin-top: 0;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 0;
      }
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 0;
        background: #2563eb;
        color: white;
        font-weight: bold;
      }
      
      @media (max-width: 768px) {
        .box {
          margin: 20px auto;
          padding: 18px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Entrar</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
      </form>
    </div>
  </body>
</html>
