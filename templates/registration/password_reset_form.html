{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alterar senha - PTM DSA</title>
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}" />
  </head>
  <body>
    <main class="page-container">
      <section class="hero">
        <h1>Alterar senha</h1>
        <p>Informe o e-mail cadastrado para receber um link seguro.</p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn-primary">Enviar link</button>
        </form>
        <p><a href="{% url 'login' %}">Voltar para o login</a></p>
      </section>
    </main>
  </body>
</html>
