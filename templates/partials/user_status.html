<style>
  .user-status {
    position: fixed;
    top: 16px;
    right: 20px;
    z-index: 2000;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  
  .user-status .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    background: #ef4444;
    box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
  }
  
  .user-status .status-dot.online {
    background: #22c55e;
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
  }
  
  .user-status a {
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    margin-left: 4px;
  }
  
  .user-status a:hover {
    text-decoration: underline;
  }
  
  @media (max-width: 768px) {
    .user-status {
      position: static;
      margin: 14px 14px 0 auto;
      width: fit-content;
      max-width: calc(100% - 28px);
      font-size: 0.8rem;
    }
  }
</style>

<div class="user-status">
  <span class="status-dot {% if request.user.is_authenticated %}online{% endif %}"></span>
  {% if request.user.is_authenticated %}
    <span>Conectado: {{ request.user.get_full_name|default:request.user.username }}</span>
    <a href="{% url 'logout' %}">Sair</a>
  {% else %}
    <span>Não conectado</span>
    <a href="{% url 'login' %}">Entrar</a>
  {% endif %}
</div>
