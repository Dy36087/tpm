{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}" />

    <title>Cadastro Facial</title>

    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
      }
      
      .container {
        width: 700px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
      }
      
      #cameraContainer {
        position: relative;
        width: 500px;
        margin: auto;
      }
      
      #camera {
        width: 100%;
      }
      
      #guiaFace {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 220px;
        height: 300px;
        transform: translate(-50%, -50%);
        border: 4px solid lime;
        border-radius: 50%;
        pointer-events: none;
      }
      
      input,
      button {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
      }
      
      @media (max-width: 768px) {
        .container {
          width: 100%;
          padding: 14px;
        }
      
        #cameraContainer {
          width: 100%;
        }
      
        #guiaFace {
          width: 170px;
          height: 230px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Cadastro Biométrico Facial</h2>

      <input type="text" id="nome" placeholder="Nome Completo" />

      <input type="text" id="cpf" placeholder="CPF" />

      <input type="text" id="rg" placeholder="RG" />

      <input type="date" id="data_nascimento" />

      <input type="email" id="email" placeholder="E-mail" />

      <input type="text" id="telefone" placeholder="Telefone" />

      <input type="text" id="cep" placeholder="CEP" />

      <input type="text" id="endereco" placeholder="Endereço" />

      <input type="text" id="bairro" placeholder="Bairro" />

      <input type="text" id="cidade" placeholder="Cidade" />

      <input type="text" id="uf" placeholder="UF" maxlength="2" />

      <div id="cameraContainer">
        <video id="camera" autoplay muted playsinline></video>

        <div id="guiaFace"></div>
      </div>

      <p id="instrucao">Posicione seu rosto dentro do oval verde</p>

      <button type="button" onclick="enviarCadastro()">Cadastrar Face</button>
    </div>

    <script>
      const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'
      
      async function carregarModelos() {
        await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL), faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)])
        console.log('Modelos carregados de', MODEL_URL)
      }
      
      async function iniciarCamera() {
        const video = document.getElementById('camera')
        const stream = await navigator.mediaDevices.getUserMedia({ video: true })
        video.srcObject = stream
        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play()
            resolve()
          }
        })
      }
      
      async function detectarFace() {
        const video = document.getElementById('camera')
        const instrucao = document.getElementById('instrucao')
      
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      
        if (!detection) {
          instrucao.textContent = 'Nenhum rosto detectado. Posicione seu rosto dentro do oval verde.'
          return { ok: false, faceEncoding: null }
        }
      
        const landmarks = await faceapi.detectFaceLandmarks(video)
        const descriptor = await faceapi.computeFaceDescriptor(video, landmarks)
      
        instrucao.textContent = 'Rosto detectado! Clique em Cadastrar Face.'
        return { ok: true, faceEncoding: Array.from(descriptor) }
      }
      
      function monitorarFace() {
        setInterval(detectarFace, 500)
      }
      
      async function enviarCadastro() {
        const nome = document.getElementById('nome').value.trim()
        if (!nome) {
          return alert('Informe o nome do servidor.')
        }
      
        const resultadoDeteccao = await detectarFace()
        if (!resultadoDeteccao.ok) {
          return alert('Rosto não detectado. Ajuste o posicionamento e tente novamente.')
        }
      
        try {
          const resposta = await fetch("{% url 'cadastrar_face' %}", {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              nome: document.getElementById('nome').value,
      
              cpf: document.getElementById('cpf').value,
      
              rg: document.getElementById('rg').value,
      
              data_nascimento: document.getElementById('data_nascimento').value,
      
              email: document.getElementById('email').value,
      
              telefone: document.getElementById('telefone').value,
      
              cep: document.getElementById('cep').value,
      
              endereco: document.getElementById('endereco').value,
      
              bairro: document.getElementById('bairro').value,
      
              cidade: document.getElementById('cidade').value,
      
              uf: document.getElementById('uf').value,
      
              face_encoding: resultadoDeteccao.faceEncoding
            })
          })
      
          const dados = await resposta.json()
      
          if (dados.sucesso) {
            alert('Rosto cadastrado com sucesso! Matrícula: ' + dados.matricula)
          } else {
            alert('Erro ao salvar no banco: ' + (dados.erro || 'Erro desconhecido'))
          }
        } catch (erro) {
          console.error(erro)
          alert('Erro ao enviar cadastro: ' + erro.message)
        }
      }
      
      window.onload = async function () {
        try {
          await carregarModelos()
          await iniciarCamera()
          monitorarFace()
          alert('Sistema iniciado com sucesso.')
        } catch (erro) {
          console.error(erro)
          alert('Erro ao iniciar sistema:\n' + erro.message)
        }
      }
    </script>
  </body>
</html>
