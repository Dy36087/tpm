{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}" />

    <title>Cadastro Facial</title>

    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
      }
      
      .container {
        width: 700px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
      }
      
      #cameraContainer {
        position: relative;
        width: 500px;
        margin: auto;
      }
      
      #camera {
        width: 100%;
      }
      
      #guiaFace {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 220px;
        height: 300px;
        transform: translate(-50%, -50%);
        border: 4px solid lime;
        border-radius: 50%;
        pointer-events: none;
      }
      
      input,
      button {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
      }

      #opcoesCadastro {
        display: flex;
        gap: 10px;
      }

      #opcoesCadastro button {
        width: auto;
        flex: 1;
      }

      #formularioCadastro {
        display: none;
      }

      #cameraContainer,
      #instrucao {
        display: none;
      }
      
      @media (max-width: 768px) {
        .container {
          width: 100%;
          padding: 14px;
        }
      
        #cameraContainer {
          width: 100%;
        }
      
        #guiaFace {
          width: 170px;
          height: 230px;
        }
      }
    </style>
  </head>

  <body>
    {% include 'partials/user_status.html' %}
    <div class="container">
      <h2>Cadastro Biométrico Facial</h2>

      <div id="opcoesCadastro">
        <button type="button" onclick="selecionarModoCadastro('facial')">Reconhecimento facial</button>
        <button type="button" onclick="selecionarModoCadastro('dados')">Somente inclusão de dados</button>
      </div>

      <div id="formularioCadastro">
      <input type="text" id="nome" placeholder="Nome Completo" />

      <input type="text" id="cpf" placeholder="CPF" />

      <input type="text" id="rg" placeholder="RG" />
      
      <label for="data_nascimento">Data de Nascimento</label>
      <input type="date" id="data_nascimento" />

      <input type="email" id="email" placeholder="E-mail" />

      <input type="text" id="telefone" placeholder="Telefone" />

      <input type="text" id="cep" placeholder="CEP" inputmode="numeric" maxlength="9" />

      <input type="text" id="endereco" placeholder="Endereço" />

      <input type="text" id="bairro" placeholder="Bairro" />

      <input type="text" id="cidade" placeholder="Cidade" />

      <input type="text" id="uf" placeholder="UF" maxlength="2" />

      <div id="cameraContainer">
        <video id="camera" autoplay muted playsinline></video>

        <div id="guiaFace"></div>
      </div>

      <p id="instrucao">Posicione seu rosto dentro do oval verde</p>

      <button type="button" id="botaoCadastro" onclick="enviarCadastro()">Cadastrar</button>
      </div>
    </div>

    <script>
      const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'
      let modoCadastro = null
      let cameraStream = null
      let monitoramentoFace = null
      
      async function carregarModelos() {
        await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL), faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)])
        console.log('Modelos carregados de', MODEL_URL)
      }
      
      async function iniciarCamera() {
        const video = document.getElementById('camera')
        const stream = await navigator.mediaDevices.getUserMedia({ video: true })
        cameraStream = stream
        video.srcObject = stream
        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play()
            resolve()
          }
        })
      }
      
      async function detectarFace() {
        const video = document.getElementById('camera')
        const instrucao = document.getElementById('instrucao')
      
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      
        if (!detection) {
          instrucao.textContent = 'Nenhum rosto detectado. Posicione seu rosto dentro do oval verde.'
          return { ok: false, faceEncoding: null }
        }
      
        const landmarks = await faceapi.detectFaceLandmarks(video)
        const descriptor = await faceapi.computeFaceDescriptor(video, landmarks)
      
        instrucao.textContent = 'Rosto detectado! Clique em Cadastrar Face.'
        return { ok: true, faceEncoding: Array.from(descriptor) }
      }
      
      function monitorarFace() {
        monitoramentoFace = setInterval(detectarFace, 500)
      }

      function prepararNovoCadastro() {
        document.getElementById('formularioCadastro').querySelectorAll('input').forEach((campo) => {
          campo.value = ''
        })
        document.getElementById('cameraContainer').style.display = 'none'
        document.getElementById('instrucao').style.display = 'none'
        document.getElementById('instrucao').textContent = 'Posicione seu rosto dentro do oval verde'
        document.getElementById('formularioCadastro').style.display = 'none'
        document.getElementById('opcoesCadastro').style.display = 'flex'
        document.getElementById('camera').srcObject = null

        if (monitoramentoFace) {
          clearInterval(monitoramentoFace)
          monitoramentoFace = null
        }
        if (cameraStream) {
          cameraStream.getTracks().forEach((track) => track.stop())
          cameraStream = null
        }
        modoCadastro = null
      }
      
      async function enviarCadastro() {
        const nome = document.getElementById('nome').value.trim()
        if (!nome) {
          return alert('Informe o nome do servidor.')
        }

        let faceEncoding = null
        if (modoCadastro === 'facial') {
          const resultadoDeteccao = await detectarFace()
          if (!resultadoDeteccao.ok) {
            return alert('Rosto não detectado. Ajuste o posicionamento e tente novamente.')
          }
          faceEncoding = resultadoDeteccao.faceEncoding
        }
      
        try {
          const resposta = await fetch("{% url 'cadastrar_face' %}", {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              nome: document.getElementById('nome').value,
      
              cpf: document.getElementById('cpf').value,
      
              rg: document.getElementById('rg').value,
      
              data_nascimento: document.getElementById('data_nascimento').value,
      
              email: document.getElementById('email').value,
      
              telefone: document.getElementById('telefone').value,
      
              cep: document.getElementById('cep').value,
      
              endereco: document.getElementById('endereco').value,
      
              bairro: document.getElementById('bairro').value,
      
              cidade: document.getElementById('cidade').value,
      
              uf: document.getElementById('uf').value,
      
              face_encoding: faceEncoding
            })
          })
      
          const tipoConteudo = resposta.headers.get('content-type') || ''
          if (!tipoConteudo.includes('application/json')) {
            throw new Error('O servidor retornou uma resposta inválida. Atualize a página e tente novamente.')
          }

          const dados = await resposta.json()
      
          if (resposta.ok && dados.sucesso) {
            alert('Cadastro realizado com sucesso! Matrícula: ' + dados.matricula)
            prepararNovoCadastro()
          } else {
            const erro = typeof dados.erro === 'object' ? Object.values(dados.erro).flat().join(' ') : dados.erro
            alert('Erro ao salvar no banco: ' + (erro || 'Erro desconhecido'))
          }
        } catch (erro) {
          console.error(erro)
          alert('Erro ao enviar cadastro: ' + erro.message)
        }
      }
      
      async function selecionarModoCadastro(modo) {
        modoCadastro = modo
        document.getElementById('opcoesCadastro').style.display = 'none'
        document.getElementById('formularioCadastro').style.display = 'block'

        if (modo === 'dados') {
          document.getElementById('botaoCadastro').textContent = 'Cadastrar dados'
          return
        }

        document.getElementById('cameraContainer').style.display = 'block'
        document.getElementById('instrucao').style.display = 'block'
        document.getElementById('botaoCadastro').textContent = 'Cadastrar Face'

        try {
          await carregarModelos()
          await iniciarCamera()
          monitorarFace()
        } catch (erro) {
          console.error(erro)
          alert('Erro ao iniciar sistema:\n' + erro.message)
        }
      }
    </script>
  </body>
</html>
