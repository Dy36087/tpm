{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Ferramentas</title>
<link rel="shortcut icon" type="image/png" href="{% static 'principal/img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'principal/css/principal.css' %}"/>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 1400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ea6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card-ferramenta {
            background: white;
            border-left: 5px solid #0078D4;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            transition: 0.3s;
            cursor: pointer;
        }

        .card-ferramenta:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }

        .codigo {
            color: #666;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .card-ferramenta {
            background: #fff;
            border-left: 5px solid #0078D4;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            transition: all .3s ease;
        }


        .btn-editar {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: #ffc107;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn-editar:hover {
            background-color: #e0a800;
            transform: translateY(-2px);
        }

        .logo-topo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-topo img {
            max-height: 120px;
            width: auto;
        }

        h1 {
            text-align-bottom: 25px;
        }

        .acoes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .botao-menu {
            text-decoration: none;
            background: #0078D4;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            font-weight: bold;
            min-width: 220px;
            text-align: center;
            transition: .3s;
        }

        .botao-menu:hover {
            background: #005ea6;
        }

        .acoes-listagem {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn-excel,
        .btn-pdf {
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-excel {
            background: #198754;
        }

        .btn-excel:hover {
            background: #157347;
        }

        .btn-pdf {
            background: #dc3545;
        }

        .btn-pdf:hover {
            background: #bb2d3b;
        }

        .pagination{
            text-align:center;
            margin-top:30px;
        }

        .pagination a{
            background:#0078D4;
            color:white;
            padding:8px 12px;
            border-radius:5px;
            text-decoration:none;
            margin:5px;
        }

        .pagination span {
            margin: 0 15px;
            font-weight: bold;
        }

        .kpis{
            display:flex;
            gap:20px;
            margin-bottom:30px;
        }

        .kpi{
            flex:1;
            background:white;
            border-radius:10px;
            padding:20px;
            text-align:center;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .filtros{
            margin-bottom:20px;
        }

        .graficos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .grafico-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            height: 400px;
        }

        .grafico-card h3 {
            text-align: center;
            margin-bottom: 15px;
        }

        .grafico-card canvas {
            width: 100% !important;
            height: 300px !important;
        }
    </style>
</head>
<body>

<h2>PTM - DSA - EDITAR FERRAMENTAS</h2>

<form method="post">
    {% csrf_token %}

    <label>Patrimônio</label>
    <input
        type="text"
        name="patrimonio"
        value="{{ ferramenta.patrimonio }}"
    >

    <label>Nome</label>
    <input
        type="text"
        name="nome"
        value="{{ ferramenta.nome }}"
    >

    <label>Categoria</label>
    <input
        type="text"
        name="categoria"
        value="{{ ferramenta.categoria }}"
    >

    <label>Fabricante</label>
    <input
        type="text"
        name="fabricante"
        value="{{ ferramenta.fabricante }}"
    >

    <label>Estado</label>
    <input
        type="text"
        name="estado"
        value="{{ ferramenta.estado }}"
    >

<div class="form-group">
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="NOVO">NOVO</option>
                    <option value="BOM">BOM</option>
                    <option value="REGULAR">REGULAR</option>
                    <option value="MANUTENCAO">MANUTENÇÃO</option>
                    <option value="INUTILIZADO">INUTILIZADO</option>
                </select>
            </div>

    <label>Descrição</label>
    <textarea name="descricao">{{ ferramenta.descricao }}</textarea>

    <button type="submit">
        Salvar Alterações
    </button>

</form>

</body>
</html>
