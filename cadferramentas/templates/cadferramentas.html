{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTM</title>
    <link
      rel="shortcut icon"
      type="image/png"
      href="{% static 'principal/img/logo.png' %}"
    />
    <link rel="stylesheet" href="{% static 'principal/css/principal.css' %}" />
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        display: flex;
        justify-content: center;
        padding: 30px;
      }
      .container {
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 700px;
      }
      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      textarea {
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 15px;
      }
      .row .form-group {
        flex: 1;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #0078d4;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background-color: #005ea6;
      }
      .logo-topo img {
        height: 120px;
      }

      .fotos-preview {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 10px;
      }

      .fotos-preview img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border: 1px solid #d9e0e3;
        border-radius: 5px;
      }

      @media (max-width: 768px) {
        body {
          display: block;
          padding: 12px;
        }
        .container {
          width: 100%;
          padding: 16px;
        }
        .row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    {% include 'partials/user_status.html' %}
    <div class="container">
      <div class="logo-topo">
        <a href="/ptmdsa/" title="Página Principal" style="pointer-events:auto"><img src="{% static 'principal/img/logo.png' %}" alt="Logotipo do PTM - DSA, no topo da página de cadastro de ferramentas" /></a>
      </div>
      <h2>PTM - DSA - CADASTRO DE FERRAMENTAS</h2>
      {% if messages %}
      {% for message in messages %}
      <div class="form-group">{{ message }}</div>
      {% endfor %}
      {% endif %}
      <form
        method="post"
        enctype="multipart/form-data"
        action="{% url 'cadastrar_ferramenta' %}"
      >
        {% csrf_token %}
        <div class="form-group">
          <label>A ferramenta possui patrimônio?</label
          ><select id="possui_patrimonio" name="possui_patrimonio" required>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
          </select>
        </div>
        <div class="row" id="patrimonio_div">
          <div class="form-group">
            <label for="patrimonio">Patrimônio</label
            ><input type="text" id="patrimonio" name="patrimonio" required />
          </div>
        </div>
        <div class="form-group">
          <label for="nome">Nome da Ferramenta</label
          ><input type="text" id="nome" name="nome" required />
        </div>
        <div class="row">
          <div class="form-group">
            <label for="categoria">Categoria</label
            ><select id="categoria" name="categoria" required>
              <option value="MANUAL">MANUAL</option>
              <option value="ELÉTRICA">ELÉTRICA</option>
              <option value="PNEUMÁTICA">PNEUMÁTICA</option>
              <option value="MEDIÇÃO">MEDIÇÃO</option>
              <option value="OUTROS">OUTROS</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fabricante">Fabricante</label
            ><input type="text" id="fabricante" name="fabricante" required />
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label for="data_aquisicao">Data de Aquisição</label
            ><input type="date" id="data_aquisicao" name="data_aquisicao" required />
          </div>
          <div class="form-group">
            <label for="valor_aquisicao">Valor da Ferramenta</label
            ><input
              type="number"
              id="valor_aquisicao"
              name="valor_aquisicao"
              min="0"
              step="0.01"
              placeholder="0,00"
              required
            />
          </div>
          <div class="form-group">
            <label for="estado">Estado</label
            ><select id="estado" name="estado" required>
              <option value="NOVO">NOVO</option>
              <option value="BOM">BOM</option>
              <option value="REGULAR">REGULAR</option>
              <option value="MANUTENCAO">MANUTENÇÃO</option>
              <option value="INUTILIZADO">INUTILIZADO</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="local">Local</label
          ><select id="local" name="local" required>
            <option value="">Selecione um cliente</option>
            {% for local in locais %}
            <option value="{{ local }}">{{ local }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="responsavel">Responsável pela Ferramenta</label>
          <select id="responsavel" name="responsavel" required>
            <option value="">Selecione um responsável</option>
            {% for servidor in servidores %}
            <option value="{{ servidor.id }}">
              {{ servidor.nome }} - Matrícula {{ servidor.matricula }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="fotos">Fotos da ferramenta</label
          ><input
            type="file"
            id="fotos"
            name="fotos"
            accept="image/*"
            multiple
            required
          />
          <div id="fotos_preview" class="fotos-preview"></div>
        </div>
        <div class="form-group">
          <label for="descricao">Descrição</label
          ><textarea id="descricao" name="descricao" rows="4" required></textarea>
        </div>
        <button type="submit">Cadastrar Ferramenta</button>
        {% include 'partials/system_access_buttons.html' %}
      </form>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const possuiPatrimonio = document.getElementById("possui_patrimonio");
        const patrimonioDiv = document.getElementById("patrimonio_div");
        const patrimonioInput = document.getElementById("patrimonio");
        const fotosInput = document.getElementById("fotos");
        const fotosPreview = document.getElementById("fotos_preview");
        function controlarPatrimonio() {
          const semPatrimonio = possuiPatrimonio.value === "nao";
          patrimonioDiv.style.display = semPatrimonio ? "none" : "block";
          patrimonioInput.required = !semPatrimonio;
          patrimonioInput.value = semPatrimonio
            ? "sem_patrimonio"
            : patrimonioInput.value === "sem_patrimonio"
              ? ""
              : patrimonioInput.value;
        }
        fotosInput.addEventListener("change", function () {
          const arquivos = Array.from(fotosInput.files).slice(0, 4);
          const transferencia = new DataTransfer();
          fotosPreview.innerHTML = "";
          arquivos.forEach((arquivo) => {
            transferencia.items.add(arquivo);
            const imagem = document.createElement("img");
            imagem.src = URL.createObjectURL(arquivo);
            imagem.alt = "Pré-visualização da foto";
            fotosPreview.appendChild(imagem);
          });
          fotosInput.files = transferencia.files;
        });
        document
          .querySelectorAll('input[type="text"], textarea')
          .forEach((field) =>
            field.addEventListener("input", function () {
              this.value = this.value.toUpperCase();
            }),
          );
        possuiPatrimonio.addEventListener("change", controlarPatrimonio);
        controlarPatrimonio();
      });
    </script>
  </body>
</html>
